schemaVersion: 2.2.2
metadata:
  name: dotnet80
  displayName: .NET 8.0
  description: .NET 8.0 application
  icon: https://github.com/dotnet/brand/raw/main/logo/dotnet-logo.png
  tags:
    - .NET
    - .NET 8.0
  projectType: dotnet
  language: .NET
  version: 1.0.0
components:
  - name: dotnet
    container:
      image: registry.redhat.io/rhel8/dotnet-80@sha256:149974c70f79d3788b571a29a97265aa54b08b28a0d13acdbec06f1c6565c6b1
      args: ["tail", "-f", "/dev/null"]
      mountSources: true
      env:
        - name: CONFIGURATION
          value: Debug
        - name: STARTUP_PROJECT
          value: app.csproj
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ASPNETCORE_URLS
          value: http://*:8080
      endpoints:
        - name: https-dotnet80
          protocol: https
          targetPort: 8080
commands:
  - id: build
    exec:
      workingDir: ${PROJECT_SOURCE}
      commandLine: kill $(pidof dotnet); dotnet build -c $CONFIGURATION $STARTUP_PROJECT /p:UseSharedCompilation=false
      component: dotnet
      group:
        isDefault: true
        kind: build
  - id: run
    exec:
      workingDir: ${PROJECT_SOURCE}
      commandLine: dotnet run -c $CONFIGURATION --no-build --project $STARTUP_PROJECT --no-launch-profile
      component: dotnet
      group:
        isDefault: true
        kind: run
